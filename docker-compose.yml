services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/mycamagent.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CAMERA_SOURCES: "0"
      TELEGRAM_ENABLED: "false"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
